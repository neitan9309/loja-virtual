<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Luxury Store</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/login.css">
</head>
<body class="admin-login-page">

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-brand">
                <a href="/" class="login-logo">LUXURY</a>
                <span class="login-badge">Admin</span>
            </div>

            <header class="login-header">
                <div class="login-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1>Acesso Restrito</h1>
                <p>Entre com suas credenciais de administrador</p>
            </header>

            <form class="login-form" id="adminLoginForm" novalidate>

                <div class="login-feedback" id="loginFeedback" aria-live="polite"></div>

                <div class="login-field">
                    <label for="adminEmail">E-mail</label>
                    <div class="login-input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input
                            type="email"
                            id="adminEmail"
                            name="email"
                            required
                            autocomplete="email"
                            placeholder="admin@luxurystore.com"
                            autofocus
                        >
                    </div>
                </div>

                <div class="login-field">
                    <label for="adminPassword">Senha</label>
                    <div class="login-input-wrapper">
                        <i class="fas fa-key"></i>
                        <input
                            type="password"
                            id="adminPassword"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="Sua senha"
                        >
                        <button
                            type="button"
                            class="login-toggle-password"
                            id="togglePassword"
                            aria-label="Mostrar senha"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-submit" id="adminLoginSubmit">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Entrar</span>
                </button>

            </form>

            <footer class="login-footer">
                <a href="/" class="login-back">
                    <i class="fas fa-arrow-left"></i>
                    <span>Voltar para a loja</span>
                </a>
            </footer>

        </div>

        <p class="login-copyright">
            &copy; 2024 Luxury Store. Todos os direitos reservados.
        </p>
    </div>

    <script src="/admin/login.js"></script>
</body>
</html>
